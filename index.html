<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 8 Teacher Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0720;
    --panel: #1a1238;
    --panel2: #241a4d;
    --ink: #f7f4ff;
    --muted: #a99fd1;
    --line: #3a2d70;
    --pink: #ff4f9a;
    --yellow: #ffd23f;
    --cyan: #3fe0f5;
    --violet: #a78bfa;
    --lime: #b6f23a;
    --orange: #ff9f4a;
    --dark: #150b2e;
    --radius: 20px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    color: var(--ink);
    line-height: 1.45;
    min-height: 100vh;
    background:
      radial-gradient(900px 600px at 8% -10%, rgba(255,79,154,.35), transparent 60%),
      radial-gradient(800px 600px at 100% 0%, rgba(63,224,245,.22), transparent 60%),
      radial-gradient(900px 700px at 50% 120%, rgba(167,139,250,.30), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 48px;
    border-bottom: 4px solid transparent;
    border-image: linear-gradient(90deg, var(--pink), var(--orange), var(--yellow), var(--lime), var(--cyan), var(--violet)) 1;
    background: rgba(12,7,32,.75); backdrop-filter: blur(8px);
  }
  header.top h1 {
    margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(90deg, var(--yellow), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #userBar { display: none; align-items: center; gap: 14px; color: var(--muted); }
  main { max-width: 1700px; margin: 0 auto; padding: 40px 48px 100px; }
  h2 { font-size: 3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 1.15rem; margin: 0 0 30px; }

  button, select, input { font: inherit; color: inherit; }
  button {
    cursor: pointer; border: 2px solid var(--line); background: var(--panel);
    padding: 12px 22px; border-radius: 14px; font-weight: 700;
    transition: transform .12s, border-color .12s, background .12s;
  }
  button:hover:not(:disabled) { border-color: var(--cyan); transform: translateY(-2px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(135deg, var(--pink), var(--orange));
    border-color: transparent; color: var(--dark);
    box-shadow: 0 6px 22px rgba(255,79,154,.4);
  }
  button.primary:hover:not(:disabled) { border-color: transparent; transform: translateY(-3px) scale(1.03); }
  button.link { border: none; background: none; padding: 0; color: var(--cyan); margin-bottom: 18px; font-size: 1.05rem; }
  button.link:hover { transform: none; text-decoration: underline; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

  #login {
    max-width: 460px; margin: 70px auto; background: var(--panel);
    border: 2px solid var(--line); border-radius: 28px; padding: 40px;
    box-shadow: 0 0 0 6px rgba(255,79,154,.12), 0 30px 80px rgba(0,0,0,.5);
  }
  #login h2 { font-size: 2.2rem; }
  #login input {
    width: 100%; padding: 14px 16px; margin: 8px 0 14px;
    border: 2px solid var(--line); border-radius: 14px; background: var(--dark);
  }
  #login input:focus { border-color: var(--cyan); outline: none; }
  #login button { width: 100%; margin-top: 8px; padding: 15px; font-size: 1.1rem; }

  #status { color: var(--muted); min-height: 1.5em; margin-bottom: 18px; }
  #status.error { color: var(--pink); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  .card {
    background: var(--panel); border: 2px solid var(--line); border-top: 10px solid var(--c, var(--pink));
    border-radius: var(--radius); padding: 26px;
    display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  .card h3 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
  .grid .card:nth-child(6n+1), .response:nth-child(6n+1) { --c: var(--pink); }
  .grid .card:nth-child(6n+2), .response:nth-child(6n+2) { --c: var(--yellow); }
  .grid .card:nth-child(6n+3), .response:nth-child(6n+3) { --c: var(--cyan); }
  .grid .card:nth-child(6n+4), .response:nth-child(6n+4) { --c: var(--lime); }
  .grid .card:nth-child(6n+5), .response:nth-child(6n+5) { --c: var(--violet); }
  .grid .card:nth-child(6n+6), .response:nth-child(6n+6) { --c: var(--orange); }
  .badge {
    font-size: .9rem; padding: 4px 14px; border-radius: 99px; font-weight: 700;
    background: var(--lime); color: var(--dark);
  }
  .badge.off { background: var(--panel2); color: var(--muted); }
  .card .meta { color: var(--muted); margin: 0; }

  .qbar {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    background: var(--panel); border: 2px solid var(--line);
    border-radius: var(--radius); padding: 18px 22px; margin: 22px 0;
    box-shadow: 0 0 0 5px rgba(63,224,245,.08);
  }
  .qbar select {
    flex: 1 1 460px; padding: 15px 16px; border-radius: 14px;
    border: 2px solid var(--cyan); background: var(--dark); font-size: 1.2rem; font-weight: 600;
  }
  .live {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--lime); font-weight: 800; font-size: 1.1rem; margin-left: auto;
  }
  .live::before {
    content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--lime);
    box-shadow: 0 0 14px var(--lime); animation: pulse 1.6s infinite;
  }
  .live.paused { color: var(--orange); }
  .live.paused::before { background: var(--orange); box-shadow: 0 0 14px var(--orange); animation: none; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.8); } }
  @media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }

  .rhead { display: flex; align-items: baseline; gap: 22px; margin: 36px 0 22px; }
  .count {
    font-size: 8rem; font-weight: 800; line-height: .9; letter-spacing: -.05em;
    background: linear-gradient(135deg, var(--yellow), var(--pink) 60%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .count-label { color: var(--ink); font-size: 2rem; font-weight: 700; }
  .responses { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }
  .response {
    background: var(--c, var(--pink)); color: var(--dark);
    border-radius: 24px; padding: 26px 28px 30px;
    display: flex; flex-direction: column; gap: 18px;
    box-shadow: 0 14px 36px rgba(0,0,0,.4);
  }
  .response.fresh { animation: arrive .55s cubic-bezier(.2,1.4,.4,1); }
  @keyframes arrive { from { transform: scale(.85) rotate(-2deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .response.fresh { animation: none; } }
  .who { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 800; font-size: 1.4rem;
    background: var(--dark); color: var(--c, var(--pink));
  }
  .name { font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; }
  .time { margin-left: auto; font-size: .95rem; font-weight: 600; opacity: .7; }
  .answer {
    margin: 0; font-size: 2.3rem; font-weight: 700; line-height: 1.15; letter-spacing: -.02em;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .answer.empty { opacity: .6; font-weight: 500; font-style: italic; font-size: 1.4rem; }
  .empty-state {
    grid-column: 1 / -1; text-align: center; padding: 80px 20px;
    border: 3px dashed var(--line); border-radius: var(--radius);
    color: var(--muted); font-size: 1.5rem; font-weight: 600;
  }
  .hidden-state {
    text-align: center; padding: 80px 20px; border-radius: var(--radius);
    background: linear-gradient(135deg, var(--violet), var(--pink));
    color: var(--dark); font-size: 2rem; font-weight: 800;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="top">
  <h1>Year 8 Teacher Dashboard</h1>
  <div id="userBar"><span id="userEmail"></span><button id="logoutButton">Log out</button></div>
</header>

<main>
  <form id="login" autocomplete="on">
    <h2>Teacher login</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Log in</button>
  </form>

  <p id="status">Please log in.</p>

  <section id="classArea" hidden>
    <h2>Your classes</h2>
    <p class="sub">Choose a class to see its lessons.</p>
    <div id="classes" class="grid"></div>
  </section>

  <section id="lessonArea" hidden>
    <button class="link" id="backToClasses">← Back to classes</button>
    <h2 id="classTitle"></h2>
    <p class="sub">Choose an active lesson.</p>
    <div id="lessons" class="grid"></div>
  </section>

  <section id="questionArea" hidden>
    <button class="link" id="backToLessons">← Back to lessons</button>
    <h2 id="lessonTitle"></h2>
    <div class="qbar">
      <select id="questionSelect" aria-label="Question">
        <option value="">Choose a question</option>
      </select>
      <button id="prevQ" aria-label="Previous question">← Prev</button>
      <button id="nextQ" aria-label="Next question">Next →</button>
      <button id="toggleButton" disabled>Hide responses</button>
      <span id="liveIndicator" class="live paused" hidden>Live</span>
    </div>

    <div id="responseArea" hidden>
      <div class="rhead">
        <span class="count" id="countNumber">0</span>
        <span class="count-label" id="countLabel">responses</span>
      </div>
      <div id="hiddenNotice" class="hidden-state" hidden>Responses are hidden. Students are still submitting.</div>
      <div id="responses" class="responses"></div>
    </div>
  </section>
</main>

<script>
  const SUPABASE_URL = "https://agkixedmhuxskfdrfbcn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_F6OHTBrA9vYWhWLUagmWvA_tojihS8U";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const POLL_MS = 3000;

  // Matches the worksheet: skill number and position in that skill's WE DO tab.
  const SKILLS = ["", "Bytes and switches", "Pixels and RGB", "Hex colour codes", "Grayscale", "Why 1 byte isn’t enough"];
  const SHEET = {
    "1t1": [1, 1], "1t4": [1, 4], "1t5": [1, 5],
    "4t1": [2, 1], "4t2": [2, 2], "4t3": [2, 3], "4t4": [2, 4],
    "rt0": [2, 5], "rtr": [2, 6], "rtg": [2, 7], "ac": [2, 8],
    "4t5": [3, 1], "ht1": [3, 2], "ht2": [3, 3], "ht3": [3, 4], "ht4": [3, 5], "ht5": [3, 6],
    "gt0": [4, 1], "gt1": [4, 2], "gt2": [4, 3], "gt3": [4, 4], "gt4": [4, 5], "gt5": [4, 6],
    "bt1": [5, 1], "bt2": [5, 2], "bt3": [5, 3], "bt4": [5, 4], "bt5": [5, 5], "bt6": [5, 6], "bt7": [5, 7]
  };
  const $ = id => document.getElementById(id);
  const statusEl = $("status");

  let currentClassId = null;
  let currentSessionId = null;
  let currentQuestionId = null;
  let currentResponses = [];
  let seenKeys = new Set();
  let pollTimer = null;
  let channel = null;
  let revealed = true;
  let lastSignature = "";

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  function show(areaId) {
    ["classArea", "lessonArea", "questionArea"].forEach(id => { $(id).hidden = id !== areaId; });
  }

  /* ---------- Auth ---------- */
  $("login").addEventListener("submit", async e => {
    e.preventDefault();
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: $("email").value,
      password: $("password").value
    });
    if (error) { setStatus("Login failed: " + error.message, true); return; }
    onLoggedIn();
  });

  $("logoutButton").addEventListener("click", async () => {
    stopCollecting();
    await supabaseClient.auth.signOut();
    location.reload();
  });

  function onLoggedIn() {
    $("login").hidden = true;
    $("userBar").style.display = "flex";
    supabaseClient.auth.getUser().then(({ data }) => {
      $("userEmail").textContent = data && data.user ? data.user.email : "";
    });
    setStatus("");
    loadClasses();
  }

  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) onLoggedIn();
  });

  /* ---------- Classes ---------- */
  async function loadClasses() {
    stopCollecting();
    show("classArea");
    setStatus("Loading classes...");
    const { data, error } = await supabaseClient.from("classes").select("id, name").order("name");
    if (error) { setStatus("Could not load classes: " + error.message, true); return; }
    setStatus("");
    const box = $("classes");
    box.innerHTML = "";
    if (!data.length) { box.textContent = "No classes found."; return; }
    data.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      const h = document.createElement("h3");
      h.textContent = item.name;
      const b = document.createElement("button");
      b.className = "primary";
      b.textContent = "Open class";
      b.addEventListener("click", () => { currentClassId = item.id; loadLessons(item.name); });
      card.append(h, b);
      box.appendChild(card);
    });
  }

  /* ---------- Lessons ---------- */
  async function loadLessons(className) {
    stopCollecting();
    show("lessonArea");
    $("classTitle").textContent = className;
    $("lessons").textContent = "Loading lessons...";
    const { data, error } = await supabaseClient
      .from("sessions")
      .select("id, worksheet_name, created_at, active")
      .eq("class_id", currentClassId)
      .order("created_at", { ascending: false });
    if (error) { $("lessons").textContent = "Could not load lessons: " + error.message; return; }
    const box = $("lessons");
    box.innerHTML = "";
    if (!data.length) { box.textContent = "No lessons found."; return; }
    data.forEach(lesson => {
      const card = document.createElement("div");
      card.className = "card";
      const badge = document.createElement("span");
      badge.className = "badge" + (lesson.active ? "" : " off");
      badge.textContent = lesson.active ? "Active" : "Inactive";
      const h = document.createElement("h3");
      h.textContent = lesson.worksheet_name;
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = new Date(lesson.created_at).toLocaleDateString(undefined,
        { weekday: "short", day: "numeric", month: "short", year: "numeric" });
      const b = document.createElement("button");
      b.className = "primary";
      b.textContent = "Open lesson";
      b.disabled = !lesson.active;
      b.addEventListener("click", () => { currentSessionId = lesson.id; loadQuestions(lesson.worksheet_name); });
      card.append(badge, h, meta, b);
      box.appendChild(card);
    });
  }

  /* ---------- Questions ---------- */
  async function loadQuestions(lessonName) {
    stopCollecting();
    show("questionArea");
    $("lessonTitle").textContent = lessonName;
    $("responseArea").hidden = true;
    $("liveIndicator").hidden = true;
    $("toggleButton").disabled = true;
    setStatus("Loading questions...");
    const { data, error } = await supabaseClient
      .from("questions")
      .select("id, question_code, question_text")
      .eq("session_id", currentSessionId)
      .order("question_code");
    if (error) { setStatus("Could not load questions: " + error.message, true); return; }
    setStatus(data.length ? "" : "This lesson has no questions yet.");
    const sel = $("questionSelect");
    sel.innerHTML = '<option value="">Choose a question</option>';
    const groups = {};
    data.forEach(q => {
      const m = SHEET[q.question_code];
      const skill = m ? m[0] : 0;
      (groups[skill] = groups[skill] || []).push({ q, pos: m ? m[1] : 0 });
    });
    [1, 2, 3, 4, 5, 0].forEach(skill => {
      if (!groups[skill]) return;
      const og = document.createElement("optgroup");
      og.label = skill ? "Skill " + skill + ": " + SKILLS[skill] : "Not on the current worksheet";
      groups[skill]
        .sort((a, b) => a.pos - b.pos || String(a.q.question_code).localeCompare(String(b.q.question_code)))
        .forEach(({ q, pos }) => {
          const o = document.createElement("option");
          o.value = q.id;
          o.textContent = (skill ? skill + "." + pos : "–") + "   " + q.question_text;
          og.appendChild(o);
        });
      sel.appendChild(og);
    });
  }

  $("questionSelect").addEventListener("change", e => {
    stopCollecting();
    if (e.target.value) startCollecting(e.target.value);
    else { $("responseArea").hidden = true; $("liveIndicator").hidden = true; $("toggleButton").disabled = true; }
  });

  function stepQuestion(dir) {
    const sel = $("questionSelect");
    const next = sel.selectedIndex + dir;
    if (next < 1 || next >= sel.options.length) return;
    sel.selectedIndex = next;
    sel.dispatchEvent(new Event("change"));
  }
  $("prevQ").addEventListener("click", () => stepQuestion(-1));
  $("nextQ").addEventListener("click", () => stepQuestion(1));

  /* ---------- Automatic collection ---------- */
  function startCollecting(questionId) {
    currentQuestionId = questionId;
    currentResponses = [];
    seenKeys = new Set();
    lastSignature = "";
    revealed = true;
    $("toggleButton").textContent = "Hide responses";
    $("toggleButton").disabled = false;
    $("responseArea").hidden = false;
    $("responses").innerHTML = "";
    $("liveIndicator").hidden = false;
    $("liveIndicator").className = "live";
    $("liveIndicator").textContent = "Live";
    applyReveal();

    fetchResponses();
    pollTimer = setInterval(fetchResponses, POLL_MS);

    // Realtime gives instant updates when enabled on the table; polling covers it otherwise.
    channel = supabaseClient
      .channel("responses-" + questionId)
      .on("postgres_changes",
        { event: "*", schema: "public", table: "responses", filter: "question_id=eq." + questionId },
        () => fetchResponses())
      .subscribe();
  }

  function stopCollecting() {
    clearInterval(pollTimer);
    pollTimer = null;
    if (channel) { supabaseClient.removeChannel(channel); channel = null; }
    currentQuestionId = null;
  }

  async function fetchResponses() {
    const qid = currentQuestionId;
    if (!qid) return;
    const { data, error } = await supabaseClient
      .from("responses")
      .select("student_id, student_name, answer, submitted_at")
      .eq("session_id", currentSessionId)
      .eq("question_id", qid)
      .order("submitted_at");
    if (qid !== currentQuestionId) return; // question changed while waiting
    if (error) {
      $("liveIndicator").className = "live paused";
      $("liveIndicator").textContent = "Connection problem, retrying";
      return;
    }
    $("liveIndicator").className = "live";
    $("liveIndicator").textContent = "Live";

    // One card per student: keep their latest answer.
    const latest = new Map();
    data.forEach((r, i) => latest.set(r.student_id || ("row" + i), r));
    currentResponses = [...latest.values()];

    const signature = JSON.stringify(currentResponses);
    if (signature === lastSignature) return;
    lastSignature = signature;
    render();
  }

  /* ---------- Display ---------- */
  function applyReveal() {
    $("responses").hidden = !revealed;
    $("hiddenNotice").hidden = revealed;
    $("toggleButton").textContent = revealed ? "Hide responses" : "Show responses";
  }

  $("toggleButton").addEventListener("click", () => { revealed = !revealed; applyReveal(); });

  function render() {
    const n = currentResponses.length;
    $("countNumber").textContent = n;
    $("countLabel").textContent = n === 1 ? "response" : "responses";

    const box = $("responses");
    box.innerHTML = "";
    if (!n) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Waiting for students to answer. Responses will appear here automatically.";
      box.appendChild(empty);
      return;
    }

    currentResponses.forEach((r, i) => {
      const key = r.student_id || ("row" + i);
      const name = r.student_name || ("Student " + (i + 1));

      const card = document.createElement("article");
      card.className = "response";
      if (!seenKeys.has(key) && seenKeys.size > 0) card.classList.add("fresh");
      seenKeys.add(key);

      const who = document.createElement("div");
      who.className = "who";
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = i + 1;
      const nm = document.createElement("span");
      nm.className = "name";
      nm.textContent = name;
      const tm = document.createElement("span");
      tm.className = "time";
      tm.textContent = r.submitted_at
        ? new Date(r.submitted_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
      who.append(av, nm, tm);

      const ans = document.createElement("p");
      ans.className = "answer" + (r.answer ? "" : " empty");
      ans.textContent = r.answer || "No answer entered";

      card.append(who, ans);
      box.appendChild(card);
    });
  }

  /* ---------- Navigation ---------- */
  $("backToClasses").addEventListener("click", loadClasses);
  $("backToLessons").addEventListener("click", () => loadLessons($("classTitle").textContent));
</script>
</body>
</html>
